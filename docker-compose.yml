version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: kams-business-manager-db
    restart: always
    environment:
      POSTGRES_USER: kams_user
      POSTGRES_PASSWORD: kams_password_secure
      POSTGRES_DB: kams_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: kams-business-manager-backend
    environment:
      - PORT=5000
      - DB_HOST=postgres
      - DB_USER=kams_user
      - DB_PASSWORD=kams_password_secure
      - DB_NAME=kams_db
      - DB_PORT=5432
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
    container_name: kams-business-manager-frontend
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: kams-business-manager-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
volumes:
  postgres_data:
